name: fload_attribution
description: "Fload install attribution for Flutter: Apple AdServices on iOS, the Play Install Referrer on Android."
version: 1.1.0
homepage: https://fload.com
repository: https://github.com/fload-ai/fload-attribution-flutter
issue_tracker: https://github.com/fload-ai/fload-attribution-flutter/issues
topics:
  - attribution
  - apple-ads
  - install-referrer
  - analytics

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fload.attribution.flutter
        pluginClass: FloadAttributionPlugin
      ios:
        pluginClass: FloadAttributionPlugin
