# Publishes to pub.dev with GitHub's OIDC token (pub.dev automated publishing;
# no stored credentials). It runs on a tag like v1.2.3 and needs, on pub.dev,
# automated publishing on for fload-ai/fload-attribution-flutter with the tag
# pattern v{{version}}. The tag must match pubspec.yaml's version.
#
# 1.0.0 is published by hand (its tag is 1.0.0, so this does not run for it).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      use-flutter: true
